<script>
  // Ask the browser/WebView not to silently evict this origin's storage
  // under disk pressure. Harmless where unsupported, best-effort, never
  // blocks app start. Same guarded pattern as app/www/trades/index.html.
  if (window.navigator && navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
</script>
<script src="life-bundle.js"></script>
<!-- No-op everywhere except inside the Capacitor Android shell. Gives
     Android a real "save/share file" path for Export Backup, which a
     bare WebView <a download> cannot do on its own. -->
<script src="capacitor-bridge.js"></script>
</body>
